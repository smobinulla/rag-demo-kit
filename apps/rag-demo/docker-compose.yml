# Local RAG demo — a real upload → embed → pgvector → retrieve pipeline.
# Embeddings run locally (fastembed/ONNX) with NO key and a small footprint.
# The answer step is OPTIONAL and provider-agnostic: set ANSWER_MODEL to any
# LiteLLM model id and supply that provider's key (see below). Without it, the
# demo returns ranked passages (a full retrieval demo, zero cost).
#
#   docker compose up --build
#   open http://localhost:8000
#   docker compose down -v        # tear down (including the vector data)
#
# Enable answers (pick ONE), e.g.:
#   ANSWER_MODEL=anthropic/claude-opus-4-8   ANTHROPIC_API_KEY=sk-...   docker compose up
#   ANSWER_MODEL=openai/gpt-4o               OPENAI_API_KEY=sk-...      docker compose up
#   ANSWER_MODEL=gemini/gemini-1.5-pro       GEMINI_API_KEY=...         docker compose up

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      args:
        APP_VERSION: "0.1.0-local"
    image: rag-demo-api:local      # same tag the k8s values reference
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      # Optional answer step — empty = retrieval-only. Set to any LiteLLM model id.
      ANSWER_MODEL: ${ANSWER_MODEL:-}
      # Provider keys (only the one matching ANSWER_MODEL is needed):
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Bedrock uses standard AWS credential env vars / IAM role:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Container-level health so `docker compose ps` shows (healthy) and
    # orchestrators can gate traffic. /health is the cheap liveness endpoint.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 90s      # first start downloads the ~130MB embed model
    restart: unless-stopped

volumes:
  pgdata:
